<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In - Darklock</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link rel="stylesheet" href="/platform/static/css/signin.css">
</head>
<body>
    <div class="container">
        <div class="signin-card">
            <div class="logo" aria-hidden="true">🔐</div>
            <h1>Admin Access</h1>
            <p class="subtitle" id="authMethod">Choose authentication method</p>

            <div id="status" class="status" role="alert"></div>

            <!-- RFID Authentication (default) -->
            <div id="rfidSection">
                <button type="button" class="btn-rfid" id="rfidBtn">
                    🔐 Scan RFID Card
                </button>

                <div class="instructions">
                    Place your authorized card on the RFID reader<br>
                    connected to the Darklock gateway
                </div>

                <div class="hw-status">
                    <span class="dot checking" id="gwDot"></span>
                    <span id="gwStatus">Checking gateway...</span>
                </div>

                <button type="button" class="btn-fallback" id="showPasswordBtn">
                    Use Password Instead
                </button>
            </div>

            <!-- Password Authentication (fallback) -->
            <div id="passwordSection" hidden>
                <form id="passwordForm">
                    <input type="email" id="email" name="email" placeholder="Email" required class="auth-input">
                    <input type="password" id="password" name="password" placeholder="Password" required class="auth-input password">
                    <button type="submit" class="btn-rfid" id="passwordBtn">
                        Sign In
                    </button>
                </form>

                <button type="button" class="btn-fallback" id="showRfidBtn">
                    ← Back to RFID
                </button>
            </div>
        </div>
    </div>

    <script defer src="/platform/static/js/signin.js"></script>
</body>
</html>
